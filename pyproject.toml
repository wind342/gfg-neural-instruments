[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gfg-neural-instruments"
version = "0.1.0"
description = "Model-adaptable, evidence-backed neural research instruments"
readme = "README.md"
requires-python = ">=3.12"
license = {file = "LICENSE"}
dependencies = ["numpy>=2.1,<3", "torch>=2.5,<3", "jsonschema>=4.23,<5"]

[project.optional-dependencies]
test = ["pytest>=8.3,<10"]

[project.scripts]
gfg-instruments-smoke = "gfg_instruments.smoke:main"
gfg-instruments-verify = "gfg_instruments.verify:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["gfg_instruments*"]

[tool.setuptools.package-data]
gfg_instruments = ["_vendor/**/*", "_vendor/**/**/*", "_vendor/**/**/**/*", "_vendor/**/**/**/**/*"]

[tool.setuptools.exclude-package-data]
"*" = ["**/__pycache__/*", "**/*.pyc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
